<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Math Quiz">
<title>Math Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF8EC; --ink:#2B2D42; --muted:#7A7D95; --card:#FFFFFF;
    --brand:#5B5FEF; --brand-dark:#3F43C9; --good:#2BB673; --bad:#F2545B;
    --key:#EEF0FF; --shadow:0 6px 0 rgba(43,45,66,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:"Baloo 2",system-ui,sans-serif;background:var(--bg);color:var(--ink);
       -webkit-user-select:none;user-select:none;touch-action:manipulation}
  .wrap{max-width:820px;margin:0 auto;padding:24px 20px 40px;min-height:100%;display:flex;flex-direction:column}
  h1{font-size:44px;margin:8px 0 4px;font-weight:800}
  .sub{color:var(--muted);font-size:20px;margin:0 0 24px}
  button{font-family:inherit;border:0;cursor:pointer}
  .hidden{display:none !important}

  /* Quiz list */
  .list{display:grid;gap:16px}
  .quiz-card{background:var(--card);border-radius:22px;padding:20px 24px;box-shadow:var(--shadow);
     display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%}
  .quiz-card:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(43,45,66,.12)}
  .quiz-card .t{font-size:28px;font-weight:700;color:var(--ink)}
  .quiz-card .m{font-size:18px;color:var(--muted)}
  .badge{font-size:20px;font-weight:700;background:var(--key);color:var(--brand-dark);padding:6px 14px;border-radius:999px;white-space:nowrap}
  .badge.new{background:#FFE7A8;color:#8A5A00}
  .msg{background:var(--card);border-radius:22px;padding:24px;box-shadow:var(--shadow);font-size:20px}

  /* Question screen */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .back{background:transparent;color:var(--muted);font-size:22px;font-weight:700;padding:8px 4px}
  .progress{flex:1;height:14px;background:#E6E3D8;border-radius:999px;overflow:hidden}
  .progress>div{height:100%;background:var(--brand);border-radius:999px;transition:width .3s}
  .count{font-size:22px;font-weight:700;color:var(--muted);min-width:70px;text-align:right}
  .qcard{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:28px 24px;text-align:center;
     transition:background .2s}
  .qcard.good{background:#E3F7EC}.qcard.bad{background:#FDE7E8}
  .qtext{font-size:clamp(40px,7vw,72px);font-weight:800;line-height:1.15;margin:4px 0 16px;word-wrap:break-word}
  .qtext.long{font-size:clamp(28px,4.5vw,40px);font-weight:700}
  .answer{display:inline-block;min-width:220px;min-height:90px;font-size:64px;font-weight:800;border-radius:20px;
     border:4px dashed #C9CCE8;padding:0 24px;line-height:82px;color:var(--brand-dark)}
  .answer.empty{color:#C9CCE8}
  .feedback{font-size:32px;font-weight:800;min-height:48px;margin-top:14px}
  .feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
  .hint-btn{background:transparent;color:var(--brand);font-size:20px;font-weight:700;margin-top:4px}
  .hint{font-size:22px;color:var(--muted);margin-top:4px}

  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:20px}
  .choice{background:var(--key);color:var(--ink);font-size:40px;font-weight:800;border-radius:20px;padding:18px;box-shadow:var(--shadow)}
  .choice.sel{background:var(--brand);color:#fff}
  .choice.right{background:var(--good);color:#fff}

  .pad{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
  .k{background:var(--key);color:var(--ink);font-size:40px;font-weight:800;border-radius:18px;height:84px;box-shadow:var(--shadow)}
  .k:active,.choice:active,.go:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(43,45,66,.12)}
  .k.fn{background:#E6E3D8;font-size:30px}
  .go{width:100%;margin-top:16px;background:var(--brand);color:#fff;font-size:34px;font-weight:800;border-radius:20px;
      height:84px;box-shadow:0 6px 0 var(--brand-dark)}
  .go:disabled{opacity:.45}
  .go.next{background:var(--good);box-shadow:0 6px 0 #1E8A56}

  /* Results */
  .result{text-align:center;background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:36px 24px}
  .stars{font-size:72px;letter-spacing:6px}
  .score{font-size:64px;font-weight:800;margin:4px 0}
  .review{text-align:left;margin-top:20px;font-size:22px}
  .review div{padding:8px 0;border-bottom:1px solid #EEE}
  .review .x{color:var(--bad)} .review .ok{color:var(--good)}
  .row{display:flex;gap:14px;margin-top:20px}
  .row .go{margin-top:0}
  .ghost{background:var(--key);color:var(--brand-dark);box-shadow:var(--shadow)}

  .parent-btn{display:block;margin:28px auto 0;background:transparent;color:var(--muted);font-size:18px;font-weight:700}
  .parent{background:var(--card);border-radius:22px;padding:20px 24px;box-shadow:var(--shadow);margin-top:12px}
  .parent h2{margin:0 0 4px;font-size:26px}.parent p{margin:0 0 12px;color:var(--muted);font-size:18px}
  .load{display:flex;align-items:center;justify-content:center;cursor:pointer}
  .loadmsg{font-size:18px;margin-top:10px;min-height:24px}
  .manage div{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #EEE;font-size:20px}
  .manage button{background:#FDE7E8;color:var(--bad);font-size:16px;font-weight:700;border-radius:10px;padding:6px 12px}
  .figure svg{width:min(320px,70%);height:auto;display:block;margin:0 auto 8px}
  .pop{animation:pop .35s ease}
  @keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
  .shake{animation:shake .35s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
</style>
</head>
<body>
<div class="wrap">

  <!-- Home -->
  <section id="home">
    <h1>Math Quiz ✏️</h1>
    <p class="sub">Pick a quiz to start!</p>
    <div id="list" class="list"><div class="msg">Loading quizzes…</div></div>
    <button class="parent-btn" id="parentBtn">⚙ Parent</button>
    <div id="parent" class="parent hidden">
      <h2>Parent corner</h2>
      <p>Load a quiz file (.json) from Files. Quizzes are saved on this iPad.</p>
      <label class="go load">📂 Load quiz file
        <input type="file" id="fileIn" accept=".json,application/json,text/plain" multiple hidden>
      </label>
      <div id="loadMsg" class="loadmsg"></div>
      <div id="manage" class="manage"></div>
    </div>
  </section>

  <!-- Question -->
  <section id="play" class="hidden">
    <div class="top">
      <button class="back" id="quit">✕ Quit</button>
      <div class="progress"><div id="bar"></div></div>
      <div class="count" id="count"></div>
    </div>
    <div class="qcard" id="qcard">
      <div id="figure" class="figure hidden"></div>
      <div class="qtext" id="qtext"></div>
      <div id="answerBox" class="answer empty">?</div>
      <div id="choices" class="choices hidden"></div>
      <div><button id="hintBtn" class="hint-btn hidden">💡 Need a hint?</button></div>
      <div id="hint" class="hint hidden"></div>
      <div id="feedback" class="feedback"></div>
    </div>
    <div id="pad" class="pad"></div>
    <button id="go" class="go" disabled>Check</button>
  </section>

  <!-- Results -->
  <section id="done" class="hidden">
    <div class="result">
      <div class="stars" id="stars"></div>
      <div class="score" id="score"></div>
      <div class="sub" id="cheer" style="margin:0"></div>
      <div class="review" id="review"></div>
    </div>
    <div class="row">
      <button class="go ghost" id="home2">All quizzes</button>
      <button class="go" id="again">Try again</button>
    </div>
  </section>

</div>

<script>
const QUIZ_FILE = "quizzes.json";
const MAX_TRIES = 2;            // tries per question before showing the answer
const $ = id => document.getElementById(id);

let quizzes = [], quiz = null, order = [], idx = 0, input = "", picked = null,
    tries = 0, locked = false, results = [];

/* ---------- storage (best scores, safe if unavailable) ---------- */
function getBest(){ try{ return JSON.parse(localStorage.getItem("mq-best")||"{}"); }catch(e){ return {}; } }
function setBest(id, score, total){
  try{ const b=getBest(); if(!b[id] || score > b[id].score){ b[id]={score,total}; localStorage.setItem("mq-best",JSON.stringify(b)); } }catch(e){}
}

/* ---------- load ---------- */
// Quizzes come from two places: quizzes.json next to the page (optional),
// and quiz files the parent uploads, which are saved on this device.
let builtIn = [];
function getUploaded(){ try{ return JSON.parse(localStorage.getItem("mq-uploaded")||"[]"); }catch(e){ return []; } }
function setUploaded(list){ try{ localStorage.setItem("mq-uploaded", JSON.stringify(list)); return true; }catch(e){ return false; } }

function mergeAll(){
  const byId = {};
  builtIn.forEach(q=> byId[q.id] = q);
  getUploaded().forEach(q=> byId[q.id] = q);          // uploaded wins if same id
  quizzes = Object.values(byId).sort((a,b)=> (b.date||"").localeCompare(a.date||""));
  renderList(); renderManage();
}

async function load(){
  try{
    const res = await fetch(QUIZ_FILE + "?v=" + Date.now(), {cache:"no-store"});
    if(res.ok) builtIn = (await res.json()).quizzes || [];
  }catch(e){ /* no bundled file — fine, use uploaded quizzes */ }
  mergeAll();
}

// Accepts {"quizzes":[...]}, a single quiz {...}, or an array of quizzes.
function extractQuizzes(data){
  const list = Array.isArray(data) ? data : Array.isArray(data.quizzes) ? data.quizzes : [data];
  list.forEach((q,i)=>{
    if(!q || !Array.isArray(q.questions) || !q.questions.length) throw new Error(`quiz ${i+1} has no "questions" list`);
    q.questions.forEach((x,j)=>{ if(x.q===undefined || x.answer===undefined) throw new Error(`"${q.title||q.id||"quiz "+(i+1)}" question ${j+1} needs "q" and "answer"`); });
    if(!q.id) q.id = (q.title || "quiz") + "-" + Date.now() + "-" + i;
  });
  return list;
}

$("fileIn").onchange = async e=>{
  const files = [...e.target.files]; let added = [], errors = [];
  for(const f of files){
    try{ added = added.concat(extractQuizzes(JSON.parse(await f.text()))); }
    catch(err){ errors.push(`${f.name}: ${err.message}`); }
  }
  if(added.length){
    const ids = new Set(added.map(q=>q.id));
    if(!setUploaded(getUploaded().filter(q=>!ids.has(q.id)).concat(added))) errors.push("Couldn't save on this device (private browsing?)");
  }
  $("loadMsg").innerHTML = (added.length ? `<span style="color:var(--good)">✔ Added: ${added.map(q=>esc(q.title||q.id)).join(", ")}</span><br>` : "")
    + errors.map(x=>`<span style="color:var(--bad)">✘ ${esc(x)}</span>`).join("<br>");
  e.target.value = ""; mergeAll();
};

function renderManage(){
  const up = getUploaded();
  $("manage").innerHTML = up.length ? "" : `<p>No uploaded quizzes yet.</p>`;
  up.forEach(q=>{
    const d = document.createElement("div");
    d.innerHTML = `<span></span><button>Remove</button>`;
    d.firstChild.textContent = q.title || q.id;
    d.lastChild.onclick = ()=>{ setUploaded(getUploaded().filter(x=>x.id!==q.id)); mergeAll(); };
    $("manage").appendChild(d);
  });
}
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
$("parentBtn").onclick = ()=> $("parent").classList.toggle("hidden");

function renderList(){
  const best = getBest();
  if(!quizzes.length){ $("list").innerHTML = `<div class="msg">No quizzes yet. Tap <b>⚙ Parent</b> below to load a quiz file.</div>`; return; }
  $("list").innerHTML = "";
  quizzes.forEach(q=>{
    const b = best[q.id];
    const btn = document.createElement("button");
    btn.className = "quiz-card";
    btn.innerHTML = `<div><div class="t"></div><div class="m"></div></div>
      <span class="badge ${b?"":"new"}">${b ? "⭐ " + b.score + "/" + b.total : "New!"}</span>`;
    btn.querySelector(".t").textContent = q.title || q.id;
    btn.querySelector(".m").textContent = `${q.questions.length} questions${q.date ? " · " + q.date : ""}`;
    btn.onclick = () => start(q);
    $("list").appendChild(btn);
  });
}

/* ---------- play ---------- */
function show(id){ ["home","play","done"].forEach(s=>$(s).classList.toggle("hidden", s!==id)); window.scrollTo(0,0); }

function start(q){
  quiz = q; idx = 0; results = [];
  order = q.questions.map((_,i)=>i);
  if(q.shuffle) for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
  show("play"); renderQ();
}

function cur(){ return quiz.questions[order[idx]]; }

function renderQ(){
  const q = cur(); input = ""; picked = null; tries = 0; locked = false;
  $("count").textContent = `${idx+1}/${order.length}`;
  $("bar").style.width = (idx/order.length*100) + "%";
  $("qtext").textContent = /^[\d\s+\-−×÷*\/().]+$/.test(q.q) ? q.q + " = " : q.q;
  const fig = q.shape ? drawShape(q.shape, q.labels || []) : (q.svg || "");
  $("figure").innerHTML = fig;
  $("figure").classList.toggle("hidden", !fig);
  $("qtext").classList.toggle("long", q.q.length > 18);
  $("qcard").className = "qcard";
  $("feedback").textContent = ""; $("feedback").className = "feedback";
  $("hint").classList.add("hidden"); $("hint").textContent = q.hint || "";
  $("hintBtn").classList.toggle("hidden", !q.hint);
  const isChoice = Array.isArray(q.choices);
  $("answerBox").classList.toggle("hidden", isChoice);
  $("pad").classList.toggle("hidden", isChoice);
  $("choices").classList.toggle("hidden", !isChoice);
  if(isChoice){
    $("choices").innerHTML = "";
    q.choices.forEach(c=>{
      const b = document.createElement("button");
      b.className = "choice"; b.textContent = c;
      b.onclick = () => { if(locked) return; picked = String(c);
        [...$("choices").children].forEach(x=>x.classList.toggle("sel", x===b)); updateGo(); };
      $("choices").appendChild(b);
    });
  }
  setGo("Check", false); updateAnswer();
}

function updateAnswer(){
  $("answerBox").textContent = input || "?";
  $("answerBox").classList.toggle("empty", !input);
  updateGo();
}
function updateGo(){ if(!locked) $("go").disabled = Array.isArray(cur().choices) ? picked===null : input===""; }
function setGo(label, next){ $("go").textContent = label; $("go").classList.toggle("next", next); $("go").disabled = false; }

/* Answer checking: numbers compare by value (so "0.50" = 0.5, "3/4" = 0.75), text compares case-insensitively */
function toNum(s){
  s = String(s).trim().replace(/,/g,"").replace(/−/g,"-");
  if(/^-?\d+\s*\/\s*\d+$/.test(s)){ const [a,b]=s.split("/").map(Number); return b ? a/b : NaN; }
  return s !== "" && !isNaN(s) ? Number(s) : NaN;
}
function isCorrect(given, q){
  const answers = [q.answer].concat(q.accept || []);
  return answers.some(a=>{
    const ga = toNum(given), aa = toNum(a);
    if(!isNaN(ga) && !isNaN(aa)) return Math.abs(ga - aa) < 1e-9;
    return String(given).trim().toLowerCase() === String(a).trim().toLowerCase();
  });
}

const CHEERS_GOOD = ["Correct! 🎉","Awesome! 🌟","You got it! 👏","Great job! 🙌","Super! 🚀"];
function check(){
  const q = cur(); const given = Array.isArray(q.choices) ? picked : input;
  tries++;
  if(isCorrect(given, q)){
    locked = true; results.push({q, given, ok:true, firstTry: tries===1});
    $("qcard").className = "qcard good pop";
    $("feedback").className = "feedback good";
    $("feedback").textContent = CHEERS_GOOD[Math.floor(Math.random()*CHEERS_GOOD.length)];
    markChoice(q);
    setGo(idx === order.length-1 ? "See score ➜" : "Next ➜", true);
  } else if(tries < MAX_TRIES){
    $("qcard").className = "qcard bad shake";
    $("feedback").className = "feedback bad";
    $("feedback").textContent = "Not quite — try again! 💪";
    input = ""; updateAnswer();
    if(Array.isArray(q.choices)){ picked = null; [...$("choices").children].forEach(x=>x.classList.remove("sel")); updateGo(); }
  } else {
    locked = true; results.push({q, given, ok:false});
    $("qcard").className = "qcard bad shake";
    $("feedback").className = "feedback bad";
    $("feedback").textContent = `The answer is ${q.answer}`;
    markChoice(q);
    setGo(idx === order.length-1 ? "See score ➜" : "Next ➜", true);
  }
}
function markChoice(q){
  if(!Array.isArray(q.choices)) return;
  [...$("choices").children].forEach(x=>{ x.classList.remove("sel"); if(isCorrect(x.textContent, q)) x.classList.add("right"); });
}

function next(){
  idx++;
  if(idx >= order.length) finish(); else renderQ();
}

function finish(){
  $("bar").style.width = "100%";
  const score = results.filter(r=>r.ok).length, total = results.length, pct = score/total;
  setBest(quiz.id, score, total);
  const stars = pct===1 ? 3 : pct>=0.7 ? 2 : pct>=0.4 ? 1 : 0;
  $("stars").textContent = "⭐".repeat(stars) + "☆".repeat(3-stars);
  $("score").textContent = `${score} / ${total}`;
  $("cheer").textContent = pct===1 ? "Perfect score! Amazing! 🏆" : pct>=0.7 ? "Great work! Keep it up! 🎈" : "Good effort! Let's practice again 💪";
  $("review").innerHTML = "";
  results.forEach(r=>{
    const d = document.createElement("div");
    d.innerHTML = r.ok ? `<span class="ok">✔</span> ` : `<span class="x">✘</span> `;
    d.appendChild(document.createTextNode(`${r.q.q}  →  ${r.q.answer}` + (r.ok ? "" : `  (you said ${r.given})`)));
    $("review").appendChild(d);
  });
  show("done");
}

/* ---------- shapes ---------- */
// Use "shape": "<name>" in a question. Optional "labels": ["8 cm","5 cm"] for side lengths.
function drawShape(name, labels){
  const S = 'stroke="#2B2D42" stroke-width="3" stroke-linejoin="round"';
  const F1 = '#BFD7FF', F2 = '#9DBEF5', F3 = '#7FA6E8';
  const L = (x,y,t,anchor="middle") => t ? `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="16" font-weight="700" fill="#3F43C9" font-family="Baloo 2, sans-serif">${esc(t)}</text>` : "";
  const poly = (n, r=70, cx=100, cy=85, rot=-90) => {
    const pts = [...Array(n)].map((_,i)=>{ const a=(rot + i*360/n)*Math.PI/180; return `${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}`; }).join(" ");
    return `<polygon points="${pts}" fill="${F1}" ${S}/>`;
  };
  const shapes = {
    triangle:  `<polygon points="100,15 180,150 20,150" fill="${F1}" ${S}/>` + L(48,80,labels[0],"end") + L(152,80,labels[1],"start") + L(100,170,labels[2]),
    square:    `<rect x="40" y="20" width="120" height="120" fill="${F1}" ${S}/>` + L(100,162,labels[0]) + L(32,85,labels[1],"end"),
    rectangle: `<rect x="15" y="35" width="170" height="90" fill="${F1}" ${S}/>` + L(100,148,labels[0]) + L(192,85,labels[1],"start"),
    circle:    `<circle cx="100" cy="85" r="70" fill="${F1}" ${S}/>`,
    pentagon:  poly(5), hexagon: poly(6, 70, 100, 85, 0), octagon: poly(8, 70, 100, 85, 22.5),
    rhombus:   `<polygon points="100,10 170,85 100,160 30,85" fill="${F1}" ${S}/>`,
    trapezoid: `<polygon points="55,30 145,30 185,140 15,140" fill="${F1}" ${S}/>` + L(100,22,labels[0]) + L(100,162,labels[1]),
    cube:      `<polygon points="40,60 120,60 120,140 40,140" fill="${F1}" ${S}/><polygon points="40,60 80,25 160,25 120,60" fill="${F2}" ${S}/><polygon points="120,60 160,25 160,105 120,140" fill="${F3}" ${S}/>`,
    "rectangular-prism": `<polygon points="15,70 135,70 135,145 15,145" fill="${F1}" ${S}/><polygon points="15,70 60,30 180,30 135,70" fill="${F2}" ${S}/><polygon points="135,70 180,30 180,105 135,145" fill="${F3}" ${S}/>`,
    "triangular-prism": `<polygon points="20,140 70,50 120,140" fill="${F1}" ${S}/><polygon points="70,50 140,25 190,115 120,140" fill="${F2}" ${S}/>`,
    "square-pyramid": `<polygon points="30,130 130,130 100,10" fill="${F1}" ${S}/><polygon points="130,130 175,100 100,10" fill="${F3}" ${S}/>`,
    cylinder:  `<path d="M40,35 L40,135 A60,18 0 0 0 160,135 L160,35" fill="${F2}" ${S}/><ellipse cx="100" cy="35" rx="60" ry="18" fill="${F1}" ${S}/>`,
    cone:      `<path d="M100,10 L40,135 A60,18 0 0 0 160,135 Z" fill="${F2}" ${S}/><path d="M40,135 A60,18 0 0 1 160,135" fill="none" stroke="#2B2D42" stroke-width="2" stroke-dasharray="6 5"/>`,
    sphere:    `<circle cx="100" cy="85" r="70" fill="${F1}" ${S}/><path d="M30,85 A70,20 0 0 0 170,85" fill="none" stroke="#2B2D42" stroke-width="2"/><path d="M30,85 A70,20 0 0 1 170,85" fill="none" stroke="#2B2D42" stroke-width="2" stroke-dasharray="6 5"/><ellipse cx="75" cy="55" rx="14" ry="9" fill="#fff" opacity=".6"/>`
  };
  const body = shapes[name];
  return body ? `<svg viewBox="-35 0 270 180" xmlns="http://www.w3.org/2000/svg">${body}</svg>` : "";
}

/* ---------- keypad ---------- */
const KEYS = ["7","8","9","⌫","4","5","6","−","1","2","3","/","0",".","C",""];
KEYS.forEach(k=>{
  const b = document.createElement("button");
  b.className = "k" + (["⌫","−","/","C"].includes(k) ? " fn" : "");
  if(!k){ b.style.visibility = "hidden"; }
  b.textContent = k;
  b.onclick = () => press(k);
  $("pad").appendChild(b);
});
function press(k){
  if(locked) return;
  if(k==="⌫") input = input.slice(0,-1);
  else if(k==="C") input = "";
  else if(k==="−"){ input = input.startsWith("-") ? input.slice(1) : "-" + input; }
  else if(k==="." && input.includes(".")) return;
  else if(k==="/" && input.includes("/")) return;
  else if(input.replace("-","").length < 8) input += k;
  updateAnswer();
}
// Hardware keyboard support (Magic Keyboard etc.)
document.addEventListener("keydown", e=>{
  if($("play").classList.contains("hidden")) return;
  if(e.key==="Enter"){ if(!$("go").disabled) $("go").click(); return; }
  if(/^[0-9./]$/.test(e.key)) press(e.key);
  else if(e.key==="-") press("−");
  else if(e.key==="Backspace") press("⌫");
});

$("go").onclick = () => locked ? next() : check();
$("hintBtn").onclick = () => { $("hint").classList.remove("hidden"); $("hintBtn").classList.add("hidden"); };
$("quit").onclick = () => { renderList(); show("home"); };
$("home2").onclick = () => { renderList(); show("home"); };
$("again").onclick = () => start(quiz);

load();
</script>
